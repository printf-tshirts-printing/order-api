# Tell the catalog when we ship.
#
# Without this, a release exists in GitHub and nowhere else: the docs team finds
# out from a support ticket, and the pages that went stale stay stale because
# nothing knows they went stale. One POST closes that gap.
name: Register release in Port

on:
  release:
    types: [published]

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange credentials for a token
        id: auth
        env:
          PORT_CLIENT_ID: ${{ secrets.PORT_CLIENT_ID }}
          PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          token="$(curl -sS -X POST https://api.port.io/v1/auth/access_token \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
                  --arg id "$PORT_CLIENT_ID" \
                  --arg secret "$PORT_CLIENT_SECRET" \
                  '{clientId: $id, clientSecret: $secret}')" \
            | jq -r .accessToken)"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Upsert the release entity
        env:
          # Never interpolate ${{ }} straight into the shell: a release body is
          # Markdown, and backticks and quotes in it become someone else's code.
          TOKEN: ${{ steps.auth.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          SERVICE: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          identifier="rel-${SERVICE}-${version//./-}"

          # A release that documents a breaking change says so in its notes.
          if printf '%s' "$BODY" | grep -qi 'breaking change'; then
            breaking=true
          else
            breaking=false
          fi

          payload="$(jq -n \
            --arg identifier "$identifier" \
            --arg title "$SERVICE $version" \
            --arg version "$version" \
            --arg shippedAt "$PUBLISHED_AT" \
            --arg summary "$BODY" \
            --arg service "$SERVICE" \
            --argjson breaking "$breaking" \
            '{
               identifier: $identifier,
               title: $title,
               properties: {
                 version: $version,
                 status: "Shipped",
                 shippedAt: $shippedAt,
                 breakingChange: $breaking,
                 summary: $summary
               },
               relations: { service: $service }
             }')"

          curl -sS --fail-with-body -X POST \
            'https://api.port.io/v1/blueprints/release/entities?upsert=true&merge=true' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$payload"
